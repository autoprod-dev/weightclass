<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-labelledby="scTitle scDesc">
  <title id="scTitle">Coach and client using WeightClass</title>
  <desc id="scDesc">A stylised coach and client beside a phone showing a workout log, with progress, meal and chat cards.</desc>
  
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d2e"/>
      <stop offset=".45" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc531"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc531"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161922"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#12141b"/>
    </linearGradient>
  </defs>

  <ellipse cx="210" cy="404" rx="180" ry="16" fill="#000" opacity=".4"/>
  <ellipse cx="560" cy="412" rx="130" ry="12" fill="#000" opacity=".35"/>
  <ellipse cx="900" cy="408" rx="150" ry="14" fill="#000" opacity=".3"/>
  <g transform="translate(70 70)">
  <g id="plates" fill="none">
    <g stroke="url(#fire)" stroke-opacity=".22">
      <circle cx="0" cy="0" r="54" stroke-width="10"/>
      <circle cx="0" cy="0" r="34" stroke-width="6"/>
      <circle cx="0" cy="0" r="12" stroke-width="8"/>
    </g>
  </g>
</g>
  <g transform="translate(1048 64) scale(.85)" stroke="url(#gold)">
  <g id="plates" fill="none">
    <g stroke="url(#fire)" stroke-opacity=".22">
      <circle cx="0" cy="0" r="54" stroke-width="10"/>
      <circle cx="0" cy="0" r="34" stroke-width="6"/>
      <circle cx="0" cy="0" r="12" stroke-width="8"/>
    </g>
  </g>
</g>
  <g transform="translate(48 132)">
  <g id="figures">
    <!-- client, left -->
    <g transform="translate(0 0)">
      <ellipse cx="86" cy="248" rx="46" ry="8" fill="#000" opacity=".35"/>
      <!-- legs -->
      <rect x="62" y="168" width="18" height="80" rx="9" fill="#2c3340"/>
      <rect x="92" y="168" width="18" height="80" rx="9" fill="#2c3340"/>
      <ellipse cx="71" cy="250" rx="14" ry="5.5" fill="#ffc531"/>
      <ellipse cx="101" cy="250" rx="14" ry="5.5" fill="#ffc531"/>
      <!-- torso -->
      <rect x="56" y="96" width="60" height="82" rx="22" fill="#3a4150"/>
      <!-- left arm + bottle -->
      <path d="M56 118c-16 8-24 28-22 46" fill="none" stroke="#3a4150" stroke-width="14" stroke-linecap="round"/>
      <g transform="translate(20 150)">
        <rect x="0" y="8" width="15" height="34" rx="5" fill="#161922" stroke="#ffc531" stroke-width="1.5"/>
        <rect x="3.5" y="0" width="8" height="10" rx="2" fill="#ffc531"/>
        <rect x="3" y="16" width="9" height="9" rx="2" fill="#3ee6b0" opacity=".85"/>
      </g>
      <!-- right arm hangs slightly back -->
      <path d="M116 120c12 10 14 28 8 46" fill="none" stroke="#3a4150" stroke-width="14" stroke-linecap="round"/>
      <!-- neck + head (plain circle, highlight only) -->
      <rect x="76" y="84" width="18" height="16" rx="6" fill="#9aa1b0"/>
      <circle cx="85" cy="68" r="20" fill="#d0d4de"/>
      <ellipse cx="78" cy="62" rx="7" ry="5" fill="#f0f2f6" opacity=".55"/>
    </g>
    <!-- coach, right, holding tablet -->
    <g transform="translate(70 0)">
      <ellipse cx="86" cy="248" rx="52" ry="8" fill="#000" opacity=".35"/>
      <rect x="58" y="172" width="20" height="78" rx="10" fill="#1c212c"/>
      <rect x="94" y="172" width="20" height="78" rx="10" fill="#1c212c"/>
      <ellipse cx="68" cy="250" rx="15" ry="5.5" fill="#ff7a1a"/>
      <ellipse cx="104" cy="250" rx="15" ry="5.5" fill="#ff7a1a"/>
      <rect x="52" y="98" width="68" height="86" rx="24" fill="#2a3140"/>
      <rect x="52" y="98" width="7" height="86" rx="3.5" fill="url(#fire)"/>
      <!-- left arm down -->
      <path d="M52 122c-16 12-20 32-14 54" fill="none" stroke="#2a3140" stroke-width="15" stroke-linecap="round"/>
      <!-- right arm to tablet -->
      <path d="M120 122c26 10 44 28 52 50" fill="none" stroke="#2a3140" stroke-width="15" stroke-linecap="round"/>
      <g transform="translate(160 154) rotate(-14)">
        <rect x="0" y="0" width="78" height="52" rx="8" fill="#0a0c11" stroke="#3a3f50" stroke-width="2"/>
        <rect x="6" y="6" width="66" height="40" rx="4" fill="#12141b"/>
        <path d="M14 34h8l6-10 6 16 6-8 8 2" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="16" r="3" fill="#ff7a1a"/>
        <rect x="24" y="14" width="22" height="3" rx="1.5" fill="#3a3f50"/>
      </g>
      <rect x="76" y="84" width="18" height="18" rx="6" fill="#9aa1b0"/>
      <circle cx="85" cy="66" r="22" fill="#d0d4de"/>
      <ellipse cx="78" cy="60" rx="7" ry="5" fill="#f0f2f6" opacity=".55"/>
    </g>
  </g>
</g>
  <path d="M300 280C370 230 420 200 470 188" fill="none" stroke="#ff7a1a" stroke-width="1.5" stroke-dasharray="4 6" opacity=".5"/>
  <g transform="translate(470 24)">
  <g id="phone">
    <rect x="0" y="0" width="210" height="392" rx="32" fill="#000" stroke="#2a2f3d" stroke-width="2"/>
    <rect x="8" y="8" width="194" height="376" rx="26" fill="url(#screen)"/>
    <rect x="78" y="16" width="54" height="6" rx="3" fill="#1b1e28"/>
    <text x="24" y="52" fill="#ff7a1a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.6">EVENING SESSION</text>
    <text x="24" y="78" fill="#f5f6f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800">Push day</text>
    <g transform="translate(24 92)">
      <rect width="22" height="22" rx="6" fill="url(#fire)"/>
      <rect x="28" y="0" width="22" height="22" rx="6" fill="#1b1e28"/>
      <rect x="56" y="0" width="22" height="22" rx="6" fill="url(#fire)"/>
      <rect x="84" y="0" width="22" height="22" rx="6" fill="url(#fire)"/>
      <rect x="112" y="0" width="22" height="22" rx="6" fill="#1b1e28"/>
      <rect x="140" y="0" width="22" height="22" rx="6" fill="#1b1e28"/>
    </g>
    <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">
      <text x="24" y="144" fill="#a7afc0">Bench press</text>
      <text x="186" y="144" text-anchor="end" fill="#ffc531" font-weight="700">3 × 8 · 62.5 kg</text>
      <line x1="24" y1="154" x2="186" y2="154" stroke="#252937"/>
      <text x="24" y="176" fill="#a7afc0">Incline DB press</text>
      <text x="186" y="176" text-anchor="end" fill="#ffc531" font-weight="700">3 × 10 · 22 kg</text>
      <line x1="24" y1="186" x2="186" y2="186" stroke="#252937"/>
      <text x="24" y="208" fill="#a7afc0">Cable fly</text>
      <text x="186" y="208" text-anchor="end" fill="#ffc531" font-weight="700">3 × 12</text>
    </g>
    <rect x="24" y="228" width="162" height="86" rx="12" fill="#171a23" stroke="#252937"/>
    <path d="M40 290 L70 272 L96 278 L124 250 L168 242" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="168" cy="242" r="4" fill="#ffc531"/>
    <text x="40" y="250" fill="#a7afc0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9">Progress</text>
    <rect x="24" y="328" width="162" height="36" rx="10" fill="#2a1510" stroke="#ffc531" stroke-opacity=".45"/>
    <text x="38" y="350" fill="#ffc531" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">New PB  Bench 65 kg</text>
  </g>
</g>
  <path d="M680 150C740 110 760 90 800 96" fill="none" stroke="#ffc531" stroke-width="1.5" stroke-dasharray="4 6" opacity=".5"/>
  <path d="M680 240C740 230 780 220 830 228" fill="none" stroke="#ff7a1a" stroke-width="1.5" stroke-dasharray="4 6" opacity=".5"/>
  <path d="M680 320C730 330 760 340 800 348" fill="none" stroke="#ffc531" stroke-width="1.5" stroke-dasharray="4 6" opacity=".45"/>
  <g transform="translate(790 40)">
  <g id="cards">
    <g id="card-progress">
      <rect width="250" height="118" rx="18" fill="url(#card)" stroke="#2a2f3d"/>
      <text x="18" y="28" fill="#ff7a1a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">PROGRESS</text>
      <text x="18" y="50" fill="#f5f6f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="800">+12.5 kg this cycle</text>
      <path d="M18 96 L58 84 L90 88 L128 64 L180 58 L226 44" fill="none" stroke="url(#fire)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="226" cy="44" r="5" fill="#ffc531"/>
    </g>
    <g id="card-meal" transform="translate(0 128)">
      <rect width="250" height="118" rx="18" fill="url(#card)" stroke="#2a2f3d"/>
      <text x="78" y="28" fill="#ff7a1a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">TODAY'S MEALS</text>
      <text x="78" y="50" fill="#f5f6f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="800">Adobo + rice</text>
      <g transform="translate(16 24)">
        <ellipse cx="26" cy="28" rx="22" ry="8" fill="#1b1e28" stroke="#ffc531" stroke-width="1.5"/>
        <path d="M8 28c2 16 16 24 36 24 20 0 34-8 36-24" fill="#2a3140" stroke="#ffc531" stroke-width="1.5"/>
        <ellipse cx="26" cy="26" rx="16" ry="6" fill="#ff7a1a"/>
        <ellipse cx="30" cy="24" rx="6" ry="3" fill="#ffc531"/>
      </g>
      <rect x="78" y="62" width="150" height="8" rx="4" fill="#1b1e28"/>
      <rect x="78" y="62" width="110" height="8" rx="4" fill="url(#fire)"/>
      <rect x="78" y="80" width="150" height="8" rx="4" fill="#1b1e28"/>
      <rect x="78" y="80" width="86" height="8" rx="4" fill="#ffc531"/>
      <text x="78" y="106" fill="#a7afc0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Protein 42g  ·  Carbs 60g</text>
    </g>
    <g id="card-chat" transform="translate(0 256)">
      <rect width="250" height="96" rx="18" fill="url(#card)" stroke="#2a2f3d"/>
      <text x="18" y="24" fill="#ff7a1a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">COACH CHAT</text>
      <rect x="18" y="36" width="150" height="22" rx="11" fill="#1b1e28"/>
      <text x="30" y="51" fill="#d0d5e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Nice work on the bench.</text>
      <rect x="82" y="64" width="150" height="22" rx="11" fill="url(#fire)"/>
      <text x="96" y="79" fill="#170900" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700">Logged. See you Thursday.</text>
    </g>
  </g>
</g>
</svg>
